[package]
name = "byckr-xattr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BYCKR's file attribute calls: the xattr crate, and rustix on iOS (ADR 0026)"
publish = false

# The `xattr` crate covers every Unix platform BYCKR supports. It has no iOS
# support, so iOS calls rustix's extended-attribute functions directly, and it
# has no Windows support, so Windows gets a no-op fallback instead.
[target.'cfg(all(unix, not(target_os = "ios")))'.dependencies]
xattr.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dev-dependencies]
byckr-test-support = { version = "0.1.0", path = "../byckr-test-support" }

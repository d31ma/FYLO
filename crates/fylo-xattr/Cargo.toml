[package]
name = "fylo-xattr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FYLO's file attribute calls: the xattr crate, and rustix on iOS (ADR 0026)"
publish = false

# Every system but iOS keeps the `xattr` crate. It has no iOS support, so
# iOS calls rustix's extended-attribute functions directly.
[target.'cfg(not(target_os = "ios"))'.dependencies]
xattr.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "fylo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FYLO in-process: open a root and use its documents, collections and queues from Rust"
publish = false

[features]
# SQL over the root through Turso's engine (ADR 0019 section 3).
sql = ["dep:parking_lot", "dep:turso_core", "dep:turso_ext"]

[dependencies]
fylo-engine = { version = "0.1.0", path = "../fylo-engine" }
# The application identity a protected `.vdbx` database opens with (ADR 0021).
fylo-identity = { version = "0.1.0", path = "../fylo-identity" }
fylo-query = { version = "0.1.0", path = "../fylo-query" }
fylo-storage-native = { version = "0.1.0", path = "../fylo-storage-native" }
fylo-vfs = { version = "0.1.0", path = "../fylo-vfs" }
# The lock type in Turso's virtual-table interface.
parking_lot = { version = "0.12.4", optional = true }
serde_json.workspace = true
# Turso's engine at the pinned release, patched with its `fylo` feature.
# 0.8.3 does not build without `fs` and `uuid`; encryption, SIMD and full-text
# search stay off.
turso_core = { version = "=0.8.3", path = "../../vendor/turso_core", default-features = false, features = ["fs", "fylo", "json", "uuid"], optional = true }
turso_ext = { version = "=0.8.3", default-features = false, optional = true }

[lints]
workspace = true

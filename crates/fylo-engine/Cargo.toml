[package]
name = "fylo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aes-gcm.workspace = true
fylo-format = { version = "0.1.0", path = "../fylo-format" }
fylo-query = { version = "0.1.0", path = "../fylo-query" }
fylo-storage-native = { version = "0.1.0", path = "../fylo-storage-native" }
hmac.workspace = true
pbkdf2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dev-dependencies]
xattr.workspace = true

[dev-dependencies]
fylo-test-support = { version = "0.1.0", path = "../fylo-test-support" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CHEX schema validation runs in-process. Its regex Unicode tables add ~390 KB
# to the browser engine, past the Wasm size budget, so neither Wasm artifact
# validates schemas (the same scope they had when CHEX was a subprocess).
fylo-chex = { version = "0.1.0", path = "../fylo-chex" }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom.workspace = true

# A browser build takes entropy from the host VFS table rather than from Web
# Crypto through a binding generator, so no `wasm_js` feature is enabled: it
# would put `__wbindgen_placeholder__` imports in the module and oblige every
# embedder to ship JavaScript glue. See `fylo-wasm`'s `__getrandom_v03_custom`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom.workspace = true

[lints]
workspace = true

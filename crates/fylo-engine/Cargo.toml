[package]
name = "fylo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aes-gcm.workspace = true
fylo-format = { version = "0.1.0", path = "../fylo-format" }
fylo-query = { version = "0.1.0", path = "../fylo-query" }
fylo-storage-native = { version = "0.1.0", path = "../fylo-storage-native" }
hmac.workspace = true
pbkdf2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

# A validator may start its own children; teardown ends its process group.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dev-dependencies]
xattr.workspace = true

[dev-dependencies]
fylo-test-support = { version = "0.1.0", path = "../fylo-test-support" }

# Schema upgraders run in an embedded JavaScript runtime. The browser engine
# reads no schema files (`std::fs` is unsupported there), so it never runs one
# and does not link the runtime, which is most of its Wasm budget.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
boa_engine.workspace = true
getrandom.workspace = true

# A browser build takes entropy from the host VFS table rather than from Web
# Crypto through a binding generator, so no `wasm_js` feature is enabled: it
# would put `__wbindgen_placeholder__` imports in the module and oblige every
# embedder to ship JavaScript glue. See `fylo-wasm`'s `__getrandom_v03_custom`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom.workspace = true

[lints]
workspace = true

[package]
name = "fylo-chex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "CHEX regex schema validation, vendored from d31ma/CHEX v26.32.02"

[features]
default = ["compile"]
# Everything that needs a regex compiler: the definition check, compiling a
# schema's leaves to DFAs, the schema loader, and the per-thread caches.
# Without it the crate loads a serialized compiled schema and validates with
# it, linking only `regex-automata`'s DFA search (ADR 0017 section 4).
compile = [
    "dep:regex",
    "regex-automata/syntax",
    "regex-automata/dfa-build",
    "regex-automata/std",
    "regex-automata/unicode-perl",
    "regex-automata/unicode-case",
]

[dependencies]
regex = { workspace = true, optional = true }
regex-automata.workspace = true
serde_json.workspace = true

[dev-dependencies]
regex.workspace = true

# Both suites compile schemas from source.
[[test]]
name = "validation"
required-features = ["compile"]

[[test]]
name = "compiled"
required-features = ["compile"]

[lints]
workspace = true

[package]
name = "fylo-storage-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Opt-in `.fxdb` encryption (ADR 0016 section 9); already in the graph
# through fylo-engine's `$encrypted` fields.
aes-gcm.workspace = true
base64.workspace = true
fylo-format = { version = "0.1.0", path = "../fylo-format" }
fylo-query = { version = "0.1.0", path = "../fylo-query" }
fylo-vfs = { version = "0.1.0", path = "../fylo-vfs" }
getrandom.workspace = true
hmac.workspace = true
lz4_flex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

# Inode identity has no meaning on a host filesystem, which has no links.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
same-file.workspace = true
# `.fxdb` zstd frames natively; the C library is too large for the browser.
zstd.workspace = true

# `.fxdb` zstd frames in the browser, decode only.
[target.'cfg(target_family = "wasm")'.dependencies]
ruzstd.workspace = true

[target.'cfg(unix)'.dependencies]
# `fcntl` byte-range locks for `.fxdb` files (ADR 0016 section 7). Already in
# the graph through `errno`, `getrandom` and others; the `struct flock` layout
# and the `F_OFD_*` commands differ per target, so they come from here rather
# than hand-written declarations.
libc = { workspace = true }
# The filesystem type (`fstatfs`) a `.fxdb` file is on, which decides whether
# its byte-range locks are trusted.
rustix.workspace = true
xattr.workspace = true

# `LockFileEx` byte-range locks and file identity for `.fxdb` files (ADR 0016
# section 7). Already in the graph through `errno`, `rustix` and `tokio`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
# Checks the browser's zstd decoder reads what the native writer produces.
ruzstd.workspace = true
fylo-test-support = { version = "0.1.0", path = "../fylo-test-support" }

# `.fxdb` byte-range locks call `fcntl` and `LockFileEx`, which no safe
# signature in the graph expresses for a byte range. ADR 0004 confines that to
# `byte_range_lock/os.rs`; `deny` rather than `forbid` is what lets that one
# module opt in with a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "fylo-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fylo-engine = { version = "0.1.0", path = "../fylo-engine" }
fylo-format = { version = "0.1.0", path = "../fylo-format" }
fylo-query = { version = "0.1.0", path = "../fylo-query" }
fylo-storage-native = { version = "0.1.0", path = "../fylo-storage-native" }
fylo-vfs = { version = "0.1.0", path = "../fylo-vfs" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

# A browser build uses the host's fetch, so it carries no TLS client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The identity a protected `.vdbx` database opens with (ADR 0021); native
# only, as in fylo-storage-native.
fylo-identity = { version = "0.1.0", path = "../fylo-identity" }
reqwest.workspace = true
rustls.workspace = true

[dev-dependencies]
fylo-test-support = { version = "0.1.0", path = "../fylo-test-support" }

[lints]
workspace = true

name: Site Deploy

on:
    workflow_run:
        workflows: [Release]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            action:
                description: Roll production back to its previous artifact
                required: true
                type: choice
                options: [rollback]

permissions: {}

concurrency:
    group: site-deploy-${{ github.repository }}
    cancel-in-progress: false

env:
    FYLO_WEB_RELEASE_BUCKET: fylo-web-releases-117469679339
    PRODUCTION_ROLE: arn:aws:iam::117469679339:role/fylo-site-deploy-production

jobs:
    resolve:
        name: Find the website zip of the release
        if: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.event == 'push'
            }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            deploy: ${{ steps.release.outputs.deploy }}
            version: ${{ steps.release.outputs.version }}
            sha256: ${{ steps.release.outputs.sha256 }}
            commit: ${{ steps.release.outputs.commit }}
            production: ${{ steps.release.outputs.production }}
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Find the release and its website zip
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  git fetch --force --tags origin
                  version=$(git show "$HEAD_SHA:package.json" | jq -r .version)
                  tag_sha=$(git rev-parse --verify --quiet "refs/tags/v$version^{commit}" || true)
                  if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
                    echo "::notice::$HEAD_SHA is not the release v$version; nothing to deploy."
                    echo "deploy=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  zip_name="fylo-site-$version.zip"
                  mkdir -p site
                  gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir site \
                    --pattern "$zip_name" --pattern "$zip_name.sha256"
                  (cd site && sha256sum --check --strict "$zip_name.sha256")
                  production_branch=$(jq -r .sites.fylo.branch ops/web-release.json)
                  if [[ "$production_branch" != "production" ]]; then
                    echo "::notice::ops/web-release.json deploys fylo to '$production_branch'; production deploys wait until it names the production branch."
                  fi
                  {
                    echo "deploy=true"
                    echo "version=$version"
                    echo "sha256=$(cut -d' ' -f1 "site/$zip_name.sha256")"
                    echo "commit=$tag_sha"
                    echo "production=$([[ "$production_branch" == "production" ]] && echo true || echo false)"
                  } >> "$GITHUB_OUTPUT"

            - name: Keep the website zip for the deploy job
              if: steps.release.outputs.deploy == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: site
                  path: site/
                  retention-days: 7
                  if-no-files-found: error

    deploy-production:
        name: Deploy production
        needs: resolve
        if: needs.resolve.outputs.deploy == 'true' && needs.resolve.outputs.production == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 110
        environment:
            name: site-production
            url: https://fylo.del.ma
        permissions:
            contents: read
            id-token: write
            statuses: read
        env:
            VERSION: ${{ needs.resolve.outputs.version }}
            SHA256: ${{ needs.resolve.outputs.sha256 }}
            COMMIT: ${{ needs.resolve.outputs.commit }}
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Download the website zip
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
              with:
                  name: site
                  path: site

            - name: Wait for the same zip to pass staging on Floci
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: bun scripts/site-staging-gate.mjs "$GITHUB_REPOSITORY" "$COMMIT" "$VERSION" "$SHA256"

            - name: Assume the production deploy role
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ env.PRODUCTION_ROLE }}
                  aws-region: ca-central-1

            - name: Deploy, probe and record production (rolls back on failure)
              run: |
                  FYLO_WEB_RELEASE_ARTIFACT="site/fylo-site-$VERSION.zip" \
                  FYLO_WEB_RELEASE_ARTIFACT_SHA256="$SHA256" \
                    bun scripts/amplify-release.mjs deploy fylo

    rollback:
        name: Roll back production
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        environment:
            name: site-production
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Assume the production deploy role
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ env.PRODUCTION_ROLE }}
                  aws-region: ca-central-1

            - name: Redeploy the previous artifact
              run: bun scripts/amplify-release.mjs rollback fylo

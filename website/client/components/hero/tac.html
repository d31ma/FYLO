<section class="home-hero" aria-labelledby="hero-heading">
    <div class="w-container w-container--lg home-hero-inner">
        <p class="home-kicker">Filesystem-first document store</p>
        <h1 id="hero-heading">FYLO</h1>
        <p class="home-headline">Query the files you already own.</p>
        <p class="home-summary">
            One canonical JSON file per document. Rebuildable zero-payload indexes, SQL and
            structured queries, version history, and durable queues — without a database server.
        </p>

        <div class="home-actions">
            <a class="w-btn w-btn-filled w-btn--lg" href="/docs">Get started</a>
            <a class="w-btn w-btn-outlined w-btn--lg" href="/download">Download FYLO</a>
        </div>

        <button class="home-install" type="button" on:click="copyInstall()">
            <span aria-hidden="true">$</span>
            <code>{installCmd}</code>
            <span class="home-install-status" aria-live="polite">Copy</span>
        </button>
    </div>
</section>

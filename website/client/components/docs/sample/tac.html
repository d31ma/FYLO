<div class="doc-sample">
    <div class="scroll-strip language-strip">
        <button
            type="button"
            class="strip-arrow"
            data-scroll-direction="-1"
            aria-label="Scroll languages left"
        >
            ‹
        </button>
        <div class="doc-sample-langs" role="group" aria-label="Language">
            <button
                type="button"
                :class="language.buttonClass('python')"
                :aria-pressed="language.pressed('python')"
                data-lang="python"
                on:click="language.choose('python')"
            >
                Python
            </button>
            <button
                type="button"
                :class="language.buttonClass('ruby')"
                :aria-pressed="language.pressed('ruby')"
                data-lang="ruby"
                on:click="language.choose('ruby')"
            >
                Ruby
            </button>
            <button
                type="button"
                :class="language.buttonClass('node')"
                :aria-pressed="language.pressed('node')"
                data-lang="node"
                on:click="language.choose('node')"
            >
                Node.js
            </button>
            <button
                type="button"
                :class="language.buttonClass('php')"
                :aria-pressed="language.pressed('php')"
                data-lang="php"
                on:click="language.choose('php')"
            >
                PHP
            </button>
            <button
                type="button"
                :class="language.buttonClass('go')"
                :aria-pressed="language.pressed('go')"
                data-lang="go"
                on:click="language.choose('go')"
            >
                Go
            </button>
            <button
                type="button"
                :class="language.buttonClass('csharp')"
                :aria-pressed="language.pressed('csharp')"
                data-lang="csharp"
                on:click="language.choose('csharp')"
            >
                C#
            </button>
            <button
                type="button"
                :class="language.buttonClass('java')"
                :aria-pressed="language.pressed('java')"
                data-lang="java"
                on:click="language.choose('java')"
            >
                Java
            </button>
            <button
                type="button"
                :class="language.buttonClass('dart')"
                :aria-pressed="language.pressed('dart')"
                data-lang="dart"
                on:click="language.choose('dart')"
            >
                Dart
            </button>
            <button
                type="button"
                :class="language.buttonClass('web')"
                :aria-pressed="language.pressed('web')"
                data-lang="web"
                on:click="language.choose('web')"
            >
                JS (Browser)
            </button>
        </div>
        <button
            type="button"
            class="strip-arrow"
            data-scroll-direction="1"
            aria-label="Scroll languages right"
        >
            ›
        </button>
    </div>

    <pre class="code-block" aria-live="polite"><code>{codeSample.code()}</code></pre>
</div>

<header class="w-app-bar w-app-bar--sticky site-header">
    <div class="w-container w-container--xl header-row">
        <a href="/" class="fylo-brand" aria-label="FYLO home">
            <img
                class="fylo-logo"
                src="/shared/assets/fylo-mark.svg"
                width="32"
                height="32"
                alt=""
                aria-hidden="true"
            />
            <span class="fylo-wordmark">FYLO</span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
            <a class="w-btn w-btn-text w-btn--sm" href="/docs">Docs</a>
            <a class="w-btn w-btn-text w-btn--sm" href="/download">Download</a>
        </nav>

        <div class="header-actions">
            <button
                type="button"
                class="w-btn w-btn-text w-btn--sm theme-toggle"
                w-theme-toggle
                aria-label="Switch color theme"
            >
                <span w-theme-icon aria-hidden="true"></span>
                <span class="theme-label" w-theme-label>Light</span>
            </button>
            <a
                class="w-btn w-btn-text w-btn--sm github-link"
                href="https://github.com/d31ma/Fylo"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="FYLO on GitHub"
            >
                <img
                    class="github-icon"
                    src="/shared/assets/github.svg"
                    width="19"
                    height="19"
                    alt=""
                    aria-hidden="true"
                />
            </a>
        </div>
    </div>
</header>
